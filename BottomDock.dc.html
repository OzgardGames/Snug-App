<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #2A2640; text-decoration: underline; }
    a:hover { color: #000000; }
    .vcx-card { transition: transform 0.15s ease; }
    .vcx-btn { transition: transform 0.08s ease, opacity 0.15s ease; cursor: pointer; }
    .vcx-btn:active { transform: scale(0.94); }
    @keyframes vcxRingPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(56,201,168,0.6); }
      50% { box-shadow: 0 0 0 6px rgba(56,201,168,0); }
    }
    @keyframes vcxWave {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }
    .vcx-wavebar { width: 3px; border-radius: 2px; background: #2A2640; display: inline-block; animation: vcxWave 0.85s ease-in-out infinite; }
    .vcx-wavebar:nth-child(1) { height: 8px; animation-delay: 0s; }
    .vcx-wavebar:nth-child(2) { height: 14px; animation-delay: 0.15s; }
    .vcx-wavebar:nth-child(3) { height: 10px; animation-delay: 0.3s; }
    .vcx-scroll::-webkit-scrollbar { width: 8px; }
    .vcx-scroll::-webkit-scrollbar-thumb { background: #F5D6C6; border-radius: 8px; }
    .vcx-scroll::-webkit-scrollbar-track { background: transparent; }
  </style>
</helmet>

<div style="position:relative;width:1280px;height:800px;overflow:hidden;background:#FDEEF2;font-family:'Nunito',sans-serif;color:#2A2640;border-radius:18px;">

  <div style="position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;">

    <!-- minimal top strip -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 24px 6px;flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;">Friday Hangout</span>
        <div onClick="{{copyCode}}" class="vcx-btn" style="display:flex;align-items:center;gap:5px;background:#FFFFFF;border-radius:999px;padding:3px 9px 3px 11px;">
          <span style="font-family:'Poppins',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:0.4px;color:#8A7C8C;">PLAY-42</span>
          <sc-if value="{{copied}}" hint-placeholder-val="{{false}}">
            <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="#38C9A8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </sc-if>
          <sc-if value="{{notCopied}}" hint-placeholder-val="{{true}}">
            <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="#8A7C8C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          </sc-if>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;background:#FFFFFF;border-radius:999px;padding:5px 12px;">
        <span style="width:6px;height:6px;border-radius:50%;background:#38C9A8;display:inline-block;"></span>
        <span style="font-size:12px;font-weight:800;">7/10</span>
      </div>
    </div>

    <!-- full-bleed voice grid -->
    <div class="vcx-scroll" style="flex:1;padding:14px 24px 8px;display:grid;grid-template-columns:repeat(5, minmax(0,1fr));gap:16px;align-content:start;overflow:auto;">
      <sc-for list="{{participants}}" as="p" hint-placeholder-count="7">
        <div class="vcx-card" style="display:flex;flex-direction:column;align-items:center;gap:9px;background:#FFFFFF;border-radius:22px;padding:18px 8px 14px;">
          <div style="position:relative;width:66px;height:66px;">
            <div style="{{p.ringStyle}}">
              <div style="width:100%;height:100%;border-radius:50%;background:{{p.color}};display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:800;font-size:21px;color:{{p.textColor}};">{{p.initials}}</div>
            </div>
            <div style="position:absolute;bottom:-3px;right:-3px;width:22px;height:22px;border-radius:50%;background:{{p.badgeBg}};border:2.5px solid #FFFFFF;display:flex;align-items:center;justify-content:center;">
              <sc-if value="{{p.muted}}" hint-placeholder-val="{{false}}">
                <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="{{p.badgeIconColor}}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v1"/><path d="M19 11a7 7 0 0 1-1.34 4.12"/><path d="M5 11a7 7 0 0 0 9.9 6.36"/><path d="M12 18v3"/><path d="M4 4l16 16"/></svg>
              </sc-if>
              <sc-if value="{{p.notMuted}}" hint-placeholder-val="{{true}}">
                <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="{{p.badgeIconColor}}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
              </sc-if>
            </div>
          </div>
          <div style="font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;text-align:center;">{{p.name}}</div>
          <sc-if value="{{p.isYou}}" hint-placeholder-val="{{false}}">
            <div style="font-family:'Poppins',sans-serif;font-size:9px;font-weight:800;color:#C96E5B;background:#FCEEE9;border-radius:999px;padding:2px 8px;letter-spacing:0.3px;">YOU</div>
          </sc-if>
          <sc-if value="{{p.talking}}" hint-placeholder-val="{{false}}">
            <div style="display:flex;align-items:flex-end;gap:2px;height:12px;">
              <span class="vcx-wavebar"></span><span class="vcx-wavebar"></span><span class="vcx-wavebar"></span>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <!-- unified bottom dock -->
    <div style="flex-shrink:0;padding:10px 24px 20px;">
      <div style="position:relative;display:flex;align-items:center;justify-content:center;gap:14px;background:#2A2640;padding:11px 22px;border-radius:999px;box-shadow:0 10px 26px rgba(42,38,64,0.28);">

        <div onClick="{{toggleMute}}" class="vcx-btn" style="width:44px;height:44px;border-radius:50%;background:{{muteBtnBg}};display:flex;align-items:center;justify-content:center;">
          <sc-if value="{{muted}}" hint-placeholder-val="{{false}}">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v1"/><path d="M19 11a7 7 0 0 1-1.34 4.12"/><path d="M5 11a7 7 0 0 0 9.9 6.36"/><path d="M12 18v3"/><path d="M4 4l16 16"/></svg>
          </sc-if>
          <sc-if value="{{micNotMuted}}" hint-placeholder-val="{{true}}">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#2A2640" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
          </sc-if>
        </div>

        <div style="position:relative;">
          <div onClick="{{toggleDevice}}" class="vcx-btn" style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0"/></svg>
          </div>
          <sc-if value="{{deviceOpen}}" hint-placeholder-val="{{false}}">
            <div style="position:absolute;bottom:56px;left:50%;transform:translateX(-50%);width:236px;background:#FFFFFF;border-radius:16px;box-shadow:0 12px 28px rgba(42,38,64,0.24);padding:8px;">
              <sc-for list="{{devices}}" as="d" hint-placeholder-count="3">
                <div onClick="{{d.pick}}" class="vcx-btn" style="display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:12px;background:{{d.rowBg}};">
                  <span style="font-size:13px;font-weight:{{d.weight}};color:#2A2640;">{{d.name}}</span>
                  <sc-if value="{{d.selected}}" hint-placeholder-val="{{false}}">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#38C9A8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>

        <div onClick="{{togglePTT}}" class="vcx-btn" style="width:44px;height:44px;border-radius:50%;background:{{pttBtnBg}};display:flex;align-items:center;justify-content:center;">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="{{pttIconColor}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </div>

        <div onClick="{{toggleShare}}" class="vcx-btn" style="position:relative;width:44px;height:44px;border-radius:50%;background:{{shareBtnBg}};display:flex;align-items:center;justify-content:center;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="{{shareIconColor}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
          <sc-if value="{{sharing}}" hint-placeholder-val="{{false}}">
            <span style="position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#B8F542;"></span>
          </sc-if>
        </div>

        <div style="width:1px;height:28px;background:rgba(255,255,255,0.15);"></div>

        <div onClick="{{toggleChat}}" class="vcx-btn" style="display:flex;align-items:center;gap:8px;background:{{chatBtnBg}};border-radius:999px;padding:11px 18px;">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span style="font-size:13px;font-weight:800;color:#FFFFFF;">Chat</span>
        </div>

      </div>
    </div>
  </div>

  <!-- slide-up chat drawer -->
  <sc-if value="{{chatOpen}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;left:24px;right:24px;bottom:108px;height:404px;background:#FFFFFF;border-radius:24px;box-shadow:0 -8px 0 rgba(0,0,0,0),0 20px 44px rgba(42,38,64,0.24);display:flex;flex-direction:column;overflow:hidden;z-index:10;">

      <div style="padding:16px 20px 10px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;">
        <span style="font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;">Chat</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <div onClick="{{toggleSearch}}" class="vcx-btn" style="width:30px;height:30px;border-radius:10px;background:#FDEEF2;display:flex;align-items:center;justify-content:center;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#2A2640" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
          </div>
          <div onClick="{{toggleChat}}" class="vcx-btn" style="width:30px;height:30px;border-radius:10px;background:#FDEEF2;display:flex;align-items:center;justify-content:center;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#2A2640" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
          </div>
        </div>
      </div>
      <sc-if value="{{searchOpen}}" hint-placeholder-val="{{false}}">
        <div style="padding:0 20px 8px;">
          <input type="text" value="{{searchQuery}}" onChange="{{updateSearch}}" placeholder="Search messages..." style="width:100%;font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;padding:9px 12px;border-radius:12px;border:none;background:#FDEEF2;outline:none;color:#2A2640;"/>
        </div>
      </sc-if>

      <div class="vcx-scroll" style="flex:1;overflow:auto;padding:4px 20px;display:flex;flex-direction:column;gap:12px;">
        <sc-for list="{{filteredMessages}}" as="m" hint-placeholder-count="4">
          <div style="display:flex;gap:10px;">
            <div style="width:30px;height:30px;border-radius:50%;background:{{m.color}};flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:800;font-size:12px;color:{{m.textColor}};">{{m.initials}}</div>
            <div style="min-width:0;">
              <div style="display:flex;align-items:baseline;gap:7px;">
                <span style="font-size:12.5px;font-weight:800;">{{m.author}}</span>
                <span style="font-size:10.5px;color:#B0A3AC;font-weight:700;">{{m.time}}</span>
              </div>
              <sc-if value="{{m.isFile}}" hint-placeholder-val="{{false}}">
                <div style="margin-top:5px;display:flex;align-items:center;gap:9px;background:#FFC145;border-radius:16px;padding:9px 12px;">
                  <div style="width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#2A2640" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                  </div>
                  <div style="min-width:0;">
                    <div style="font-size:12.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#2A2640;">{{m.fileName}}</div>
                    <div style="font-size:10.5px;color:#5C5266;font-weight:700;">{{m.fileSize}}</div>
                  </div>
                </div>
              </sc-if>
              <sc-if value="{{m.isText}}" hint-placeholder-val="{{true}}">
                <div style="font-size:13px;font-weight:600;line-height:1.4;margin-top:2px;">{{m.text}}</div>
              </sc-if>
            </div>
          </div>
        </sc-for>
      </div>

      <div style="padding:8px 20px;flex-shrink:0;">
        <div style="{{dropZoneStyle}}">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="{{dropIconColor}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
          <span style="font-size:11.5px;font-weight:800;color:{{dropTextColor}};">{{dropLabel}}</span>
        </div>
      </div>

      <div style="padding:0 20px 20px;flex-shrink:0;">
        <div style="display:flex;align-items:center;gap:8px;background:#FDEEF2;border-radius:16px;padding:8px 8px 8px 14px;">
          <input type="text" placeholder="Message the room..." style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:'Nunito',sans-serif;font-weight:600;font-size:13px;color:#2A2640;"/>
          <div class="vcx-btn" style="width:34px;height:34px;border-radius:11px;background:#2A2640;display:flex;align-items:center;justify-content:center;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          </div>
        </div>
      </div>

    </div>
  </sc-if>

</div>

</x-dc>
<script data-dc-script data-props='{"showDropOverlay":{"editor":"boolean","default":false,"section":"Preview"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      muted: false,
      pushToTalk: false,
      deviceOpen: false,
      selectedDevice: "MacBook Pro Microphone",
      searchOpen: false,
      searchQuery: "",
      sharing: false,
      copied: false,
      chatOpen: false
    };
    this._devices = ["MacBook Pro Microphone", "AirPods Pro", "Blue Yeti USB Mic"];
    this._participants = [
      { id: "jad", name: "Jad", color: "#FF6F91", textColor: "#2A2640", isYou: true, talkingBase: false, mutedBase: false },
      { id: "maya", name: "Maya", color: "#38C9A8", textColor: "#2A2640", isYou: false, talkingBase: true, mutedBase: false },
      { id: "leo", name: "Leo", color: "#FFC145", textColor: "#2A2640", isYou: false, talkingBase: false, mutedBase: true },
      { id: "sam", name: "Sam", color: "#B69CE8", textColor: "#2A2640", isYou: false, talkingBase: false, mutedBase: false },
      { id: "ari", name: "Ari", color: "#6FB8E8", textColor: "#2A2640", isYou: false, talkingBase: false, mutedBase: false },
      { id: "noor", name: "Noor", color: "#FFA36C", textColor: "#2A2640", isYou: false, talkingBase: false, mutedBase: true },
      { id: "kai", name: "Kai", color: "#FF8FAE", textColor: "#2A2640", isYou: false, talkingBase: false, mutedBase: false }
    ];
    this._messages = [
      { id: 1, author: "Maya", color: "#38C9A8", textColor: "#2A2640", time: "2:14 PM", text: "did you see that last round, that was so close", isText: true, isFile: false },
      { id: 2, author: "Leo", color: "#FFC145", textColor: "#2A2640", time: "2:15 PM", text: "I was today years old when I learned that combo", isText: true, isFile: false },
      { id: 3, author: "Jad", color: "#FF6F91", textColor: "#2A2640", time: "2:16 PM", isFile: true, isText: false, fileName: "round-12-clip.mp4", fileSize: "14.2 MB" },
      { id: 4, author: "Sam", color: "#B69CE8", textColor: "#2A2640", time: "2:18 PM", text: "sending the map layout now", isText: true, isFile: false }
    ];
    this.toggleMute = this.toggleMute.bind(this);
    this.togglePTT = this.togglePTT.bind(this);
    this.toggleDevice = this.toggleDevice.bind(this);
    this.toggleSearch = this.toggleSearch.bind(this);
    this.toggleShare = this.toggleShare.bind(this);
    this.toggleChat = this.toggleChat.bind(this);
    this.copyCode = this.copyCode.bind(this);
    this.updateSearch = this.updateSearch.bind(this);
  }
  toggleMute() { this.setState({ muted: !this.state.muted }); }
  togglePTT() { this.setState({ pushToTalk: !this.state.pushToTalk }); }
  toggleDevice() { this.setState({ deviceOpen: !this.state.deviceOpen }); }
  toggleSearch() { this.setState({ searchOpen: !this.state.searchOpen, searchQuery: "" }); }
  toggleShare() { this.setState({ sharing: !this.state.sharing }); }
  toggleChat() { this.setState({ chatOpen: !this.state.chatOpen }); }
  updateSearch(e) { this.setState({ searchQuery: e.target.value }); }
  copyCode() {
    this.setState({ copied: true });
    setTimeout(() => { this.setState({ copied: false }); }, 1600);
  }
  renderVals() {
    const s = this.state;
    const initials = (n) => n.slice(0, 1).toUpperCase();

    const participants = this._participants.map((p) => {
      const muted = p.isYou ? s.muted : p.mutedBase;
      const talking = p.talkingBase && !muted;
      let ringStyle = "width:100%;height:100%;border-radius:50%;";
      if (talking) {
        ringStyle += "padding:3px;animation:vcxRingPulse 1.4s infinite;border-radius:50%;";
      } else {
        ringStyle += "padding:3px;";
      }
      const badgeBg = muted ? "#2A2640" : (talking ? "#2A2640" : "#F3E6EC");
      const badgeIconColor = (muted || talking) ? "#FFFFFF" : "#2A2640";
      return {
        id: p.id,
        name: p.name,
        color: p.color,
        textColor: p.textColor,
        initials: initials(p.name),
        isYou: p.isYou,
        muted: muted,
        notMuted: !muted,
        talking: talking,
        ringStyle: ringStyle,
        badgeBg: badgeBg,
        badgeIconColor: badgeIconColor
      };
    });

    const devices = this._devices.map((d) => ({
      name: d,
      selected: d === s.selectedDevice,
      weight: d === s.selectedDevice ? "800" : "500",
      rowBg: d === s.selectedDevice ? "#FDEEF2" : "transparent",
      pick: () => this.setState({ selectedDevice: d, deviceOpen: false })
    }));

    const q = s.searchQuery.trim().toLowerCase();
    const filteredMessages = this._messages
      .filter((m) => {
        if (!q) return true;
        const haystack = (m.author + " " + (m.text || "") + " " + (m.fileName || "")).toLowerCase();
        return haystack.indexOf(q) !== -1;
      })
      .map((m) => ({ ...m, initials: initials(m.author) }));

    return {
      muted: s.muted,
      micNotMuted: !s.muted,
      muteBtnBg: s.muted ? "#FF6F91" : "#FFFFFF",
      copied: s.copied,
      notCopied: !s.copied,
      participants: participants,
      deviceOpen: s.deviceOpen,
      selectedDevice: s.selectedDevice,
      devices: devices,
      pttBtnBg: s.pushToTalk ? "#38C9A8" : "rgba(255,255,255,0.1)",
      pttIconColor: "#FFFFFF",
      sharing: s.sharing,
      shareBtnBg: s.sharing ? "#FF6F91" : "rgba(255,255,255,0.1)",
      shareIconColor: "#FFFFFF",
      chatOpen: s.chatOpen,
      chatBtnBg: s.chatOpen ? "#38C9A8" : "rgba(255,255,255,0.1)",
      searchOpen: s.searchOpen,
      searchQuery: s.searchQuery,
      filteredMessages: filteredMessages,
      dropZoneStyle: "display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;border:2px dashed " + (this.props.showDropOverlay ? "#38C9A8" : "#F0E4EA") + ";border-radius:14px;padding:12px 8px;background:" + (this.props.showDropOverlay ? "#EAFAF5" : "#FDEEF2") + ";transition:all 0.15s ease;",
      dropIconColor: this.props.showDropOverlay ? "#1E8F73" : "#B0A3AC",
      dropTextColor: this.props.showDropOverlay ? "#1E8F73" : "#8A7C8C",
      dropLabel: this.props.showDropOverlay ? "Drop to upload" : "Drag & drop files",
      toggleMute: this.toggleMute,
      togglePTT: this.togglePTT,
      toggleDevice: this.toggleDevice,
      toggleSearch: this.toggleSearch,
      toggleShare: this.toggleShare,
      toggleChat: this.toggleChat,
      copyCode: this.copyCode,
      updateSearch: this.updateSearch
    };
  }
}
</script>
