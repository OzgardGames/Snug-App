<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #22D3EE; text-decoration: none; }
    a:hover { color: #0EA5C4; }
    .vcb-card { transition: transform 0.15s ease; }
    .vcb-btn { transition: transform 0.08s ease; cursor: pointer; }
    .vcb-btn:active { transform: translate(3px,3px) !important; box-shadow: none !important; }
    @keyframes vcbBounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes vcbWave {
      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(1); }
    }
    .vcb-wavebar { width: 4px; border-radius: 2px; background: #2B1B4D; display: inline-block; animation: vcbWave 0.8s ease-in-out infinite; }
    .vcb-wavebar:nth-child(1) { height: 9px; animation-delay: 0s; }
    .vcb-wavebar:nth-child(2) { height: 15px; animation-delay: 0.14s; }
    .vcb-wavebar:nth-child(3) { height: 11px; animation-delay: 0.28s; }
    .vcb-scroll::-webkit-scrollbar { width: 8px; }
    .vcb-scroll::-webkit-scrollbar-thumb { background: #C9B8F5; border-radius: 8px; }
    .vcb-scroll::-webkit-scrollbar-track { background: transparent; }
  </style>
</helmet>

<div style="position:relative;width:1280px;height:800px;overflow:hidden;background:linear-gradient(135deg,#7C3AED 0%,#C026D3 55%,#F97316 100%);font-family:'Nunito',sans-serif;color:#2B1B4D;border-radius:18px;">

  <!-- confetti -->
  <div style="position:absolute;top:36px;left:640px;width:14px;height:14px;border-radius:4px;background:#FFD400;transform:rotate(18deg);opacity:0.8;"></div>
  <div style="position:absolute;top:120px;left:740px;width:10px;height:10px;border-radius:50%;background:#9CE01B;opacity:0.75;"></div>
  <div style="position:absolute;top:70px;left:500px;width:11px;height:11px;border-radius:3px;background:#22D3EE;transform:rotate(-12deg);opacity:0.7;"></div>
  <div style="position:absolute;bottom:120px;left:60px;width:12px;height:12px;border-radius:50%;background:#FF3D9A;opacity:0.6;"></div>
  <div style="position:absolute;bottom:60px;left:180px;width:13px;height:13px;border-radius:4px;background:#FFD400;transform:rotate(30deg);opacity:0.65;"></div>

  <div style="position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;">

    <!-- top bar -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 28px;flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:14px;">
        <div style="width:42px;height:42px;border-radius:13px;background:#FFD400;border:3px solid #2B1B4D;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:3px 3px 0 rgba(43,27,77,0.9);">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#2B1B4D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15V9a1 1 0 0 1 1-1h3l4-3v14l-4-3H5a1 1 0 0 1-1-1Z"/><path d="M16 9a3 3 0 0 1 0 6"/><path d="M18.5 6.5a7 7 0 0 1 0 11"/></svg>
        </div>
        <div>
          <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;line-height:1.1;color:#FFFFFF;text-shadow:2px 2px 0 #2B1B4D;">Friday Hangout</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
            <div onClick="{{copyCode}}" class="vcb-btn" style="display:flex;align-items:center;gap:6px;background:#FFFFFF;border:2.5px solid #2B1B4D;border-radius:999px;padding:3px 10px 3px 12px;box-shadow:2.5px 2.5px 0 rgba(43,27,77,0.9);">
              <span style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.5px;color:#C026D3;">PLAY-42</span>
              <sc-if value="{{copied}}" hint-placeholder-val="{{false}}">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#4FAE3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              </sc-if>
              <sc-if value="{{notCopied}}" hint-placeholder-val="{{true}}">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#C026D3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
              </sc-if>
            </div>
            <span style="font-size:12.5px;font-weight:700;color:#FFFFFF;text-shadow:1px 1px 0 rgba(43,27,77,0.6);">tap to copy &amp; invite friends</span>
          </div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="display:flex;align-items:center;gap:6px;background:#FFFFFF;border:2.5px solid #2B1B4D;border-radius:999px;padding:6px 14px;box-shadow:2.5px 2.5px 0 rgba(43,27,77,0.9);">
          <span style="width:8px;height:8px;border-radius:50%;background:#9CE01B;display:inline-block;"></span>
          <span style="font-size:13.5px;font-weight:800;">7/10</span>
          <span style="font-size:13px;color:#6B5A94;font-weight:600;">in room</span>
        </div>
        <div class="vcb-btn" style="width:40px;height:40px;border-radius:13px;background:#FFFFFF;border:2.5px solid #2B1B4D;display:flex;align-items:center;justify-content:center;box-shadow:2.5px 2.5px 0 rgba(43,27,77,0.9);">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#2B1B4D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="15" cy="6" r="2.2" fill="#2B1B4D" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="9" cy="12" r="2.2" fill="#2B1B4D" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="17" cy="18" r="2.2" fill="#2B1B4D" stroke="none"/></svg>
        </div>
      </div>
    </div>

    <!-- body -->
    <div style="flex:1;display:flex;min-height:0;padding:0 20px 20px;gap:20px;">

      <!-- main voice column -->
      <div style="flex:1;display:flex;flex-direction:column;min-width:0;">

        <div class="vcb-scroll" style="flex:1;padding:10px 6px;display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:20px;align-content:start;overflow:auto;">

          <sc-for list="{{participants}}" as="p" hint-placeholder-count="7">
            <div class="vcb-card" style="display:flex;flex-direction:column;align-items:center;gap:10px;background:#FFFFFF;border-radius:22px;padding:20px 10px 16px;border:3px solid #2B1B4D;box-shadow:5px 5px 0 rgba(43,27,77,0.9);">
              <div style="position:relative;width:80px;height:80px;">
                <div style="{{p.ringStyle}}">
                  <div style="width:100%;height:100%;border-radius:50%;background:{{p.color}};border:3px solid #2B1B4D;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:26px;color:#FFFFFF;">{{p.initials}}</div>
                </div>
                <div style="position:absolute;bottom:-4px;right:-4px;width:27px;height:27px;border-radius:50%;background:{{p.badgeBg}};border:2.5px solid #2B1B4D;display:flex;align-items:center;justify-content:center;">
                  <sc-if value="{{p.muted}}" hint-placeholder-val="{{false}}">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v1"/><path d="M19 11a7 7 0 0 1-1.34 4.12"/><path d="M5 11a7 7 0 0 0 9.9 6.36"/><path d="M12 18v3"/><path d="M4 4l16 16"/></svg>
                  </sc-if>
                  <sc-if value="{{p.notMuted}}" hint-placeholder-val="{{true}}">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#2B1B4D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
                  </sc-if>
                </div>
              </div>
              <div style="font-family:'Baloo 2',sans-serif;font-size:15px;font-weight:700;text-align:center;">{{p.name}}</div>
              <sc-if value="{{p.isYou}}" hint-placeholder-val="{{false}}">
                <div style="font-family:'Baloo 2',sans-serif;font-size:10px;font-weight:700;color:#FFFFFF;background:#FF3D9A;border:2px solid #2B1B4D;border-radius:999px;padding:2px 9px;letter-spacing:0.3px;">YOU</div>
              </sc-if>
              <sc-if value="{{p.talking}}" hint-placeholder-val="{{false}}">
                <div style="display:flex;align-items:flex-end;gap:2px;height:15px;">
                  <span class="vcb-wavebar"></span><span class="vcb-wavebar"></span><span class="vcb-wavebar"></span>
                </div>
              </sc-if>
            </div>
          </sc-for>

        </div>

        <!-- mic control bar -->
        <div style="padding:12px 6px 4px;display:flex;justify-content:center;flex-shrink:0;">
          <div style="position:relative;display:flex;align-items:center;gap:16px;background:#FFFFFF;padding:10px 20px;border-radius:999px;border:3px solid #2B1B4D;box-shadow:5px 5px 0 rgba(43,27,77,0.9);">

            <!-- mute -->
            <div onClick="{{toggleMute}}" class="vcb-btn" style="width:50px;height:50px;border-radius:50%;background:{{muteBtnBg}};border:2.5px solid #2B1B4D;display:flex;align-items:center;justify-content:center;">
              <sc-if value="{{muted}}" hint-placeholder-val="{{false}}">
                <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v1"/><path d="M19 11a7 7 0 0 1-1.34 4.12"/><path d="M5 11a7 7 0 0 0 9.9 6.36"/><path d="M12 18v3"/><path d="M4 4l16 16"/></svg>
              </sc-if>
              <sc-if value="{{micNotMuted}}" hint-placeholder-val="{{true}}">
                <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#2B1B4D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
              </sc-if>
            </div>

            <div style="width:2px;height:32px;background:#2B1B4D;opacity:0.15;"></div>

            <!-- device selector -->
            <div onClick="{{toggleDevice}}" class="vcb-btn" style="display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:#F4EBFF;border:2px solid #2B1B4D;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#2B1B4D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0"/></svg>
              <span style="font-size:13px;font-weight:800;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{selectedDevice}}</span>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#2B1B4D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </div>

            <sc-if value="{{deviceOpen}}" hint-placeholder-val="{{false}}">
              <div style="position:absolute;bottom:68px;left:96px;width:222px;background:#FFFFFF;border:3px solid #2B1B4D;border-radius:16px;box-shadow:5px 5px 0 rgba(43,27,77,0.9);padding:6px;">
                <sc-for list="{{devices}}" as="d" hint-placeholder-count="3">
                  <div onClick="{{d.pick}}" class="vcb-btn" style="display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:10px;background:{{d.rowBg}};">
                    <span style="font-size:13px;font-weight:{{d.weight}};">{{d.name}}</span>
                    <sc-if value="{{d.selected}}" hint-placeholder-val="{{false}}">
                      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#C026D3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                    </sc-if>
                  </div>
                </sc-for>
              </div>
            </sc-if>

            <div style="width:2px;height:32px;background:#2B1B4D;opacity:0.15;"></div>

            <!-- push to talk -->
            <div onClick="{{togglePTT}}" class="vcb-btn" style="display:flex;align-items:center;gap:9px;padding:9px 6px;">
              <span style="font-size:13px;font-weight:800;color:#2B1B4D;">Push to talk</span>
              <div style="{{pttTrackStyle}}">
                <div style="{{pttThumbStyle}}"></div>
              </div>
            </div>

            <div style="width:2px;height:32px;background:#2B1B4D;opacity:0.15;"></div>

            <!-- screen share -->
            <div onClick="{{toggleShare}}" class="vcb-btn" style="display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:{{shareBtnBg}};border:2.5px solid #2B1B4D;">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="{{shareIconColor}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
              <sc-if value="{{sharing}}" hint-placeholder-val="{{false}}">
                <span style="width:7px;height:7px;border-radius:50%;background:#FFFFFF;display:inline-block;"></span>
                <span style="font-size:13px;font-weight:800;color:#FFFFFF;">Sharing</span>
              </sc-if>
              <sc-if value="{{notSharing}}" hint-placeholder-val="{{true}}">
                <span style="font-size:13px;font-weight:800;color:#0B7285;">Share Screen</span>
              </sc-if>
            </div>

          </div>
        </div>

      </div>

      <!-- side panel -->
      <div style="width:336px;flex-shrink:0;display:flex;flex-direction:column;background:#FFFFFF;border:3px solid #2B1B4D;border-radius:22px;box-shadow:5px 5px 0 rgba(43,27,77,0.9);margin-top:10px;margin-bottom:4px;overflow:hidden;">

        <div style="padding:18px 20px 12px;flex-shrink:0;border-bottom:2.5px solid #2B1B4D;">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:18px;">Chat</span>
            <div onClick="{{toggleSearch}}" class="vcb-btn" style="width:32px;height:32px;border-radius:10px;background:#F4EBFF;border:2px solid #2B1B4D;display:flex;align-items:center;justify-content:center;">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#2B1B4D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
            </div>
          </div>
          <sc-if value="{{searchOpen}}" hint-placeholder-val="{{false}}">
            <input type="text" value="{{searchQuery}}" onChange="{{updateSearch}}" placeholder="Search messages..." style="margin-top:10px;width:100%;font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;padding:9px 12px;border-radius:10px;border:2px solid #2B1B4D;background:#FFFFFF;outline:none;color:#2B1B4D;"/>
          </sc-if>
        </div>

        <div class="vcb-scroll" style="flex:1;overflow:auto;padding:14px 20px;display:flex;flex-direction:column;gap:14px;">
          <sc-for list="{{filteredMessages}}" as="m" hint-placeholder-count="4">
            <div style="display:flex;gap:10px;">
              <div style="width:30px;height:30px;border-radius:50%;background:{{m.color}};border:2px solid #2B1B4D;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:12px;color:#FFFFFF;">{{m.initials}}</div>
              <div style="min-width:0;">
                <div style="display:flex;align-items:baseline;gap:7px;">
                  <span style="font-size:12.5px;font-weight:800;">{{m.author}}</span>
                  <span style="font-size:10.5px;color:#8A76B8;font-weight:700;">{{m.time}}</span>
                </div>
                <sc-if value="{{m.isFile}}" hint-placeholder-val="{{false}}">
                  <div style="margin-top:5px;display:flex;align-items:center;gap:9px;background:#F4EBFF;border:2px solid #2B1B4D;border-radius:13px;padding:9px 12px;">
                    <div style="width:30px;height:30px;border-radius:9px;background:#FFD400;border:2px solid #2B1B4D;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#2B1B4D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                    </div>
                    <div style="min-width:0;">
                      <div style="font-size:12.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{m.fileName}}</div>
                      <div style="font-size:10.5px;color:#6B5A94;font-weight:700;">{{m.fileSize}}</div>
                    </div>
                  </div>
                </sc-if>
                <sc-if value="{{m.isText}}" hint-placeholder-val="{{true}}">
                  <div style="font-size:13px;font-weight:600;line-height:1.4;margin-top:2px;">{{m.text}}</div>
                </sc-if>
              </div>
            </div>
          </sc-for>
        </div>

        <div style="padding:8px 20px;flex-shrink:0;">
          <div style="{{dropZoneStyle}}">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="{{dropIconColor}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
            <span style="font-size:12px;font-weight:800;color:{{dropTextColor}};">{{dropLabel}}</span>
            <span style="font-size:10.5px;color:#8A76B8;font-weight:700;">images, videos &amp; files</span>
          </div>
        </div>

        <div style="padding:0 20px 20px;flex-shrink:0;">
          <div style="display:flex;align-items:center;gap:8px;background:#F4EBFF;border:2.5px solid #2B1B4D;border-radius:16px;padding:8px 8px 8px 14px;">
            <input type="text" placeholder="Message the room..." style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:'Nunito',sans-serif;font-weight:600;font-size:13px;color:#2B1B4D;"/>
            <div class="vcb-btn" style="width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#6B5A94" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05 12.25 20.24a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95L10.13 17.1a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </div>
            <div class="vcb-btn" style="width:34px;height:34px;border-radius:10px;background:#FF3D9A;border:2px solid #2B1B4D;display:flex;align-items:center;justify-content:center;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"showDropOverlay":{"editor":"boolean","default":false,"section":"Preview"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      muted: false,
      pushToTalk: false,
      deviceOpen: false,
      selectedDevice: "MacBook Pro Microphone",
      searchOpen: false,
      searchQuery: "",
      sharing: false,
      copied: false
    };
    this._devices = ["MacBook Pro Microphone", "AirPods Pro", "Blue Yeti USB Mic"];
    this._participants = [
      { id: "jad", name: "Jad", color: "#FF3D9A", isYou: true, talkingBase: false, mutedBase: false },
      { id: "maya", name: "Maya", color: "#22D3EE", isYou: false, talkingBase: true, mutedBase: false },
      { id: "leo", name: "Leo", color: "#FFD400", isYou: false, talkingBase: false, mutedBase: true },
      { id: "sam", name: "Sam", color: "#8B5CF6", isYou: false, talkingBase: false, mutedBase: false },
      { id: "ari", name: "Ari", color: "#FF7A1A", isYou: false, talkingBase: false, mutedBase: false },
      { id: "noor", name: "Noor", color: "#2F8FFF", isYou: false, talkingBase: false, mutedBase: true },
      { id: "kai", name: "Kai", color: "#9CE01B", isYou: false, talkingBase: false, mutedBase: false }
    ];
    this._messages = [
      { id: 1, author: "Maya", color: "#22D3EE", time: "2:14 PM", text: "did you see that last round, that was so close", isText: true, isFile: false },
      { id: 2, author: "Leo", color: "#FFD400", time: "2:15 PM", text: "I was today years old when I learned that combo", isText: true, isFile: false },
      { id: 3, author: "Jad", color: "#FF3D9A", time: "2:16 PM", isFile: true, isText: false, fileName: "round-12-clip.mp4", fileSize: "14.2 MB" },
      { id: 4, author: "Sam", color: "#8B5CF6", time: "2:18 PM", text: "sending the map layout now", isText: true, isFile: false }
    ];
    this.toggleMute = this.toggleMute.bind(this);
    this.togglePTT = this.togglePTT.bind(this);
    this.toggleDevice = this.toggleDevice.bind(this);
    this.toggleSearch = this.toggleSearch.bind(this);
    this.toggleShare = this.toggleShare.bind(this);
    this.copyCode = this.copyCode.bind(this);
    this.updateSearch = this.updateSearch.bind(this);
  }
  toggleMute() { this.setState({ muted: !this.state.muted }); }
  togglePTT() { this.setState({ pushToTalk: !this.state.pushToTalk }); }
  toggleDevice() { this.setState({ deviceOpen: !this.state.deviceOpen }); }
  toggleSearch() { this.setState({ searchOpen: !this.state.searchOpen, searchQuery: "" }); }
  toggleShare() { this.setState({ sharing: !this.state.sharing }); }
  updateSearch(e) { this.setState({ searchQuery: e.target.value }); }
  copyCode() {
    this.setState({ copied: true });
    setTimeout(() => { this.setState({ copied: false }); }, 1600);
  }
  renderVals() {
    const s = this.state;
    const initials = (n) => n.slice(0, 1).toUpperCase();

    const participants = this._participants.map((p) => {
      const muted = p.isYou ? s.muted : p.mutedBase;
      const talking = p.talkingBase && !muted;
      let ringStyle = "width:100%;height:100%;border-radius:50%;";
      if (talking) {
        ringStyle += "padding:4px;background:#9CE01B;animation:vcbBounce 1s ease-in-out infinite;";
      } else {
        ringStyle += "padding:4px;background:transparent;";
      }
      const badgeBg = muted ? "#FF3D9A" : (talking ? "#9CE01B" : "#FFFFFF");
      return {
        id: p.id,
        name: p.name,
        color: p.color,
        initials: initials(p.name),
        isYou: p.isYou,
        muted: muted,
        notMuted: !muted,
        talking: talking,
        ringStyle: ringStyle,
        badgeBg: badgeBg
      };
    });

    const devices = this._devices.map((d) => ({
      name: d,
      selected: d === s.selectedDevice,
      weight: d === s.selectedDevice ? "800" : "600",
      rowBg: d === s.selectedDevice ? "#F4EBFF" : "transparent",
      pick: () => this.setState({ selectedDevice: d, deviceOpen: false })
    }));

    const q = s.searchQuery.trim().toLowerCase();
    const filteredMessages = this._messages
      .filter((m) => {
        if (!q) return true;
        const haystack = (m.author + " " + (m.text || "") + " " + (m.fileName || "")).toLowerCase();
        return haystack.indexOf(q) !== -1;
      })
      .map((m) => ({ ...m, initials: initials(m.author) }));

    const pttOn = s.pushToTalk;
    const pttTrackStyle = "width:40px;height:23px;border-radius:999px;position:relative;border:2px solid #2B1B4D;background:" + (pttOn ? "#22D3EE" : "#F4EBFF") + ";transition:background 0.15s ease;";
    const pttThumbStyle = "position:absolute;top:1.5px;left:" + (pttOn ? "18px" : "2px") + ";width:17px;height:17px;border-radius:50%;background:#FFFFFF;border:2px solid #2B1B4D;transition:left 0.15s ease;";

    return {
      muted: s.muted,
      micNotMuted: !s.muted,
      muteBtnBg: s.muted ? "#FF3D9A" : "#F4EBFF",
      copied: s.copied,
      notCopied: !s.copied,
      participants: participants,
      deviceOpen: s.deviceOpen,
      selectedDevice: s.selectedDevice,
      devices: devices,
      pttTrackStyle: pttTrackStyle,
      pttThumbStyle: pttThumbStyle,
      sharing: s.sharing,
      notSharing: !s.sharing,
      shareBtnBg: s.sharing ? "#FF3D9A" : "#CFFAFE",
      shareIconColor: s.sharing ? "#FFFFFF" : "#0B7285",
      searchOpen: s.searchOpen,
      searchQuery: s.searchQuery,
      filteredMessages: filteredMessages,
      dropZoneStyle: "display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;border:3px dashed " + (this.props.showDropOverlay ? "#C026D3" : "#2B1B4D") + ";border-radius:16px;padding:13px 10px;background:" + (this.props.showDropOverlay ? "#FCE7FB" : "transparent") + ";opacity:" + (this.props.showDropOverlay ? "1" : "0.85") + ";transition:all 0.15s ease;",
      dropIconColor: this.props.showDropOverlay ? "#C026D3" : "#2B1B4D",
      dropTextColor: this.props.showDropOverlay ? "#C026D3" : "#2B1B4D",
      dropLabel: this.props.showDropOverlay ? "Drop to upload" : "Drag & drop here",
      toggleMute: this.toggleMute,
      togglePTT: this.togglePTT,
      toggleDevice: this.toggleDevice,
      toggleSearch: this.toggleSearch,
      toggleShare: this.toggleShare,
      copyCode: this.copyCode,
      updateSearch: this.updateSearch
    };
  }
}
</script>
</body>
</html>
